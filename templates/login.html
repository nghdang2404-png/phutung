<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Đối Soát PO Nam Sương</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'SVN-MonaSans';
            src: url("{{ url_for('static', filename='fonts/SVN-MonaSans-SemiBoldWide.otf') }}") format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body { 
            background: #f4f6f9; 
            font-family: 'SVN-MonaSans', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem;
        }
        .login-card { 
            width: 100%; 
            max-width: 420px; 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(13,110,253,0.08); 
            background: #fff; 
            padding: 2rem; 
            border-top: 5px solid #0d6efd; 
        }
        .btn-nam-suong { background-color: #0d6efd; border-color: #0d6efd; color: #fff; }
        .btn-nam-suong:hover { background-color: #0b5ed7; border-color: #0a58ca; color: #fff; }
        .brand-logo { max-height: 55px; object-fit: contain; }

        @media (max-width: 576px) {
            .login-card {
                padding: 1.5rem;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Nam Sương Motor Logo" class="brand-logo mb-2">
            <h4 class="fw-bold text-dark mb-1 fs-5">NAM SƯƠNG MOTOR</h4>
            <p class="text-muted small mb-0">Hệ Thống Đối Soát Mã Phụ Tùng PO</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert"><i class="bi bi-exclamation-circle me-1"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-nam-suong w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Đăng Nhập Hệ Thống
            </button>
        </form>
    </div>
</body>
</html>
